<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grindcraft Minimal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'VT323', monospace;
            user-select: none;
            background-color: #2b2b2b;
            color: white;
            font-size: 1.2rem;
            margin: 0;
            overflow: hidden;
        }

        /* Minecraft-esque Blocky Styles */
        .mc-panel {
            background-color: #c6c6c6;
            border: 4px solid;
            border-color: #ffffff #555555 #555555 #ffffff;
            color: #000;
        }

        .mc-sidebar {
            background-color: #634327;
            background-image: repeating-linear-gradient(45deg, rgba(0,0,0,0.05) 25%, transparent 25%, transparent 75%, rgba(0,0,0,0.05) 75%, rgba(0,0,0,0.05)), repeating-linear-gradient(45deg, rgba(0,0,0,0.05) 25%, transparent 25%, transparent 75%, rgba(0,0,0,0.05) 75%, rgba(0,0,0,0.05));
            background-position: 0 0, 10px 10px;
            background-size: 20px 20px;
            border-right: 4px solid #3a2515;
            color: #f2f2f2;
        }

        .mc-main {
            background-color: #568a34;
            background-image: repeating-linear-gradient(45deg, rgba(0,0,0,0.02) 25%, transparent 25%, transparent 75%, rgba(0,0,0,0.02) 75%, rgba(0,0,0,0.02)), repeating-linear-gradient(45deg, rgba(0,0,0,0.02) 25%, transparent 25%, transparent 75%, rgba(0,0,0,0.02) 75%, rgba(0,0,0,0.02));
            background-position: 0 0, 20px 20px;
            background-size: 40px 40px;
        }

        .mc-btn {
            background-color: #8b8b8b;
            border: 3px solid;
            border-color: #d1d1d1 #3b3b3b #3b3b3b #d1d1d1;
            color: #000;
            padding: 10px 16px;
            font-size: 1.25rem;
            cursor: pointer;
            transition: transform 0.05s, border-color 0.05s;
            text-align: left;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .mc-btn:hover:not(:disabled) {
            background-color: #9e9e9e;
        }

        .mc-btn:active:not(:disabled) {
            border-color: #3b3b3b #d1d1d1 #d1d1d1 #3b3b3b;
            transform: translateY(2px);
        }

        .mc-btn:disabled {
            background-color: #555555;
            border-color: #777777 #333333 #333333 #777777;
            color: #888888;
            cursor: not-allowed;
        }

        .item-icon {
            display: inline-block;
            width: 24px;
            height: 24px;
            background-color: rgba(0,0,0,0.2);
            margin-right: 8px;
            vertical-align: middle;
            border: 2px solid rgba(255,255,255,0.2);
        }
        
        .inv-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 2px dashed rgba(255,255,255,0.2);
        }

        .cost-label {
            font-size: 0.9rem;
            color: #4a0000;
            margin-top: 4px;
            display: block;
        }
        
        .mc-btn:disabled .cost-label {
            color: #888;
        }

    </style>
</head>
<body class="h-screen flex">

    <!-- Left Sidebar: Inventory -->
    <div class="mc-sidebar w-64 md:w-80 flex-shrink-0 p-6 flex flex-col h-full overflow-y-auto">
        <h1 class="text-3xl font-bold mb-6 text-yellow-300 drop-shadow-md text-center">INVENTORY</h1>
        
        <div class="flex-1 flex flex-col gap-2" id="inventory-list">
            <!-- Inventory items updated by JS -->
            <div class="inv-item text-xl">
                <span><span class="item-icon bg-[#654321]"></span>Wood</span>
                <span id="inv-wood" class="font-bold text-yellow-300">0</span>
            </div>
            <div class="inv-item text-xl">
                <span><span class="item-icon bg-[#d1a760]"></span>Planks</span>
                <span id="inv-planks" class="font-bold text-yellow-300">0</span>
            </div>
            <div class="inv-item text-xl">
                <span><span class="item-icon bg-[#8b5a2b]" style="width:4px; margin-left:10px; margin-right:18px;"></span>Sticks</span>
                <span id="inv-sticks" class="font-bold text-yellow-300">0</span>
            </div>
            <div class="inv-item text-xl">
                <span><span class="item-icon bg-[#7f7f7f]"></span>Stone</span>
                <span id="inv-stone" class="font-bold text-yellow-300">0</span>
            </div>
            <div class="inv-item text-xl mt-6 border-t-4 border-white/20 pt-4">
                <span><span class="item-icon bg-[#a08050]"></span>Wood Pickaxe</span>
                <span id="inv-pickaxe" class="font-bold text-yellow-300">0</span>
            </div>
        </div>
    </div>

    <!-- Main Area: Gathering and Crafting -->
    <div class="mc-main flex-1 p-8 h-full overflow-y-auto flex flex-col lg:flex-row gap-8">
        
        <!-- Gather Column -->
        <div class="flex-1 max-w-md flex flex-col gap-4">
            <div class="mc-panel p-6 shadow-xl">
                <h2 class="text-2xl font-bold mb-4 border-b-2 border-gray-400 pb-2">Gather</h2>
                <div class="flex flex-col gap-4">
                    <button class="mc-btn w-full" id="btn-punch-tree" onclick="gather('wood')">
                        <div>
                            <div class="font-bold">Punch Tree</div>
                            <div class="text-sm text-gray-700 mt-1">+1 Wood</div>
                        </div>
                        <div class="text-3xl">🌳</div>
                    </button>
                    
                    <button class="mc-btn w-full" id="btn-mine-stone" onclick="gather('stone')" style="display: none;">
                        <div>
                            <div class="font-bold">Mine Stone</div>
                            <div class="text-sm text-gray-700 mt-1">+1 Stone</div>
                        </div>
                        <div class="text-3xl">🪨</div>
                    </button>
                    <div id="req-mine-stone" class="text-sm text-center bg-black/50 text-white p-2 border-2 border-dashed border-gray-300">
                        Requires Wooden Pickaxe to Mine Stone
                    </div>
                </div>
            </div>
        </div>

        <!-- Craft Column -->
        <div class="flex-1 max-w-md flex flex-col gap-4">
            <div class="mc-panel p-6 shadow-xl">
                <h2 class="text-2xl font-bold mb-4 border-b-2 border-gray-400 pb-2">Craft</h2>
                <div class="flex flex-col gap-4">
                    
                    <button class="mc-btn w-full flex-col items-start" id="btn-craft-planks" onclick="craft('planks')">
                        <div class="flex justify-between w-full items-center">
                            <span class="font-bold">Craft Planks</span>
                            <span class="text-xl">🪵</span>
                        </div>
                        <span class="cost-label">Cost: 1 Wood &rarr; Yield: 4 Planks</span>
                    </button>

                    <button class="mc-btn w-full flex-col items-start" id="btn-craft-sticks" onclick="craft('sticks')">
                        <div class="flex justify-between w-full items-center">
                            <span class="font-bold">Craft Sticks</span>
                            <span class="text-xl">🥢</span>
                        </div>
                        <span class="cost-label">Cost: 2 Planks &rarr; Yield: 4 Sticks</span>
                    </button>

                    <button class="mc-btn w-full flex-col items-start" id="btn-craft-pickaxe" onclick="craft('pickaxe')">
                        <div class="flex justify-between w-full items-center">
                            <span class="font-bold">Craft Wooden Pickaxe</span>
                            <span class="text-xl">⛏️</span>
                        </div>
                        <span class="cost-label">Cost: 3 Planks, 2 Sticks &rarr; Yield: 1 Pickaxe</span>
                    </button>

                </div>
            </div>
        </div>

    </div>

    <script>
        // Game State (Inventory)
        const inventory = {
            wood: 0,
            planks: 0,
            sticks: 0,
            stone: 0,
            pickaxe: 0
        };

        // Costs and Yields definitions
        const recipes = {
            planks: {
                cost: { wood: 1 },
                yield: 4
            },
            sticks: {
                cost: { planks: 2 },
                yield: 4
            },
            pickaxe: {
                cost: { planks: 3, sticks: 2 },
                yield: 1
            }
        };

        // DOM Elements
        const els = {
            inv: {
                wood: document.getElementById('inv-wood'),
                planks: document.getElementById('inv-planks'),
                sticks: document.getElementById('inv-sticks'),
                stone: document.getElementById('inv-stone'),
                pickaxe: document.getElementById('inv-pickaxe'),
            },
            btn: {
                craftPlanks: document.getElementById('btn-craft-planks'),
                craftSticks: document.getElementById('btn-craft-sticks'),
                craftPickaxe: document.getElementById('btn-craft-pickaxe'),
                mineStone: document.getElementById('btn-mine-stone'),
            },
            req: {
                mineStone: document.getElementById('req-mine-stone')
            }
        };

        // Action Functions
        function gather(type) {
            if (type === 'wood') {
                inventory.wood += 1;
            } else if (type === 'stone') {
                if (inventory.pickaxe > 0) {
                    inventory.stone += 1;
                }
            }
            updateUI();
        }

        function craft(itemKey) {
            const recipe = recipes[itemKey];
            if (!recipe) return;

            // Check if we can afford it
            let canAfford = true;
            for (const [res, amount] of Object.entries(recipe.cost)) {
                if (inventory[res] < amount) {
                    canAfford = false;
                    break;
                }
            }

            if (canAfford) {
                // Deduct costs
                for (const [res, amount] of Object.entries(recipe.cost)) {
                    inventory[res] -= amount;
                }
                // Add yields
                inventory[itemKey] += recipe.yield;
                updateUI();
            }
        }

        // UI Update Loop
        function updateUI() {
            // Update Inventory Text
            els.inv.wood.textContent = inventory.wood;
            els.inv.planks.textContent = inventory.planks;
            els.inv.sticks.textContent = inventory.sticks;
            els.inv.stone.textContent = inventory.stone;
            els.inv.pickaxe.textContent = inventory.pickaxe;

            // Evaluate Crafting Buttons Disabled State
            els.btn.craftPlanks.disabled = inventory.wood < recipes.planks.cost.wood;
            els.btn.craftSticks.disabled = inventory.planks < recipes.sticks.cost.planks;
            
            const canCraftPickaxe = inventory.planks >= recipes.pickaxe.cost.planks && 
                                    inventory.sticks >= recipes.pickaxe.cost.sticks;
            els.btn.craftPickaxe.disabled = !canCraftPickaxe;

            // Evaluate Gathering Buttons Unlock State
            if (inventory.pickaxe > 0) {
                els.btn.mineStone.style.display = 'flex';
                els.req.mineStone.style.display = 'none';
            } else {
                els.btn.mineStone.style.display = 'none';
                els.req.mineStone.style.display = 'block';
            }
        }

        // Initialize UI on load
        window.onload = function() {
            updateUI();
        };

    </script>
</body>
</html>
